apiVersion: v1
kind: ConfigMap
metadata:
  name: customer-events-producer-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  customer-events-producer.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "type": "stat",
          "title": "Producer Availability",
          "id": 1,
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "expr": "up{job=\"customer-events-producer\"}",
              "legendFormat": "Producer",
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "DOWN"
                    },
                    "1": {
                      "text": "UP"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "value": null
                  },
                  {
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "title": "Events Produced / Second",
          "id": 2,
          "gridPos": {
            "h": 8,
            "w": 9,
            "x": 6,
            "y": 0
          },
          "targets": [
            {
              "expr": "rate(customer_events_produced_total{job=\"customer-events-producer\"}[5m])",
              "legendFormat": "Events/sec",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "decimals": 2
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "single"
            }
          }
        },
        {
          "type": "stat",
          "title": "Total Events Produced",
          "id": 3,
          "gridPos": {
            "h": 4,
            "w": 9,
            "x": 15,
            "y": 0
          },
          "targets": [
            {
              "expr": "sum(customer_events_produced_total{job=\"customer-events-producer\"})",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto"
          }
        },
        {
          "type": "timeseries",
          "title": "Event Failure Rate",
          "id": 4,
          "gridPos": {
            "h": 8,
            "w": 9,
            "x": 0,
            "y": 8
          },
          "targets": [
            {
              "expr": "rate(customer_events_failed_total{job=\"customer-events-producer\"}[5m])",
              "legendFormat": "Failures/sec",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "decimals": 3
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "single"
            }
          }
        },
        {
          "type": "stat",
          "title": "Total Failed Events",
          "id": 5,
          "gridPos": {
            "h": 4,
            "w": 9,
            "x": 9,
            "y": 8
          },
          "targets": [
            {
              "expr": "sum(customer_events_failed_total{job=\"customer-events-producer\"})",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto"
          }
        },
        {
          "type": "timeseries",
          "title": "Kafka Produce Latency",
          "id": 6,
          "gridPos": {
            "h": 8,
            "w": 9,
            "x": 9,
            "y": 12
          },
          "targets": [
            {
              "expr": "rate(customer_events_produce_latency_seconds_sum{job=\"customer-events-producer\"}[5m]) / rate(customer_events_produce_latency_seconds_count{job=\"customer-events-producer\"}[5m])",
              "legendFormat": "Average latency",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 4
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "single"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Producer Pod Restarts",
          "id": 7,
          "gridPos": {
            "h": 8,
            "w": 9,
            "x": 0,
            "y": 16
          },
          "targets": [
            {
              "expr": "kube_pod_container_status_restarts_total{namespace=\"customer-events\", container=\"customer-events-producer\"}",
              "legendFormat": "Restarts",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "single"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Producer CPU Usage",
          "id": 8,
          "gridPos": {
            "h": 8,
            "w": 9,
            "x": 9,
            "y": 20
          },
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"customer-events\", container=\"customer-events-producer\"}[5m]))",
              "legendFormat": "CPU cores",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "cores",
              "decimals": 3
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "single"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Producer Memory Usage",
          "id": 9,
          "gridPos": {
            "h": 8,
            "w": 9,
            "x": 0,
            "y": 24
          },
          "targets": [
            {
              "expr": "container_memory_working_set_bytes{namespace=\"customer-events\", container=\"customer-events-producer\"}",
              "legendFormat": "Memory",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "single"
            }
          }
        }
      ],
      "refresh": "15s",
      "schemaVersion": 39,
      "tags": [
        "kafka",
        "customer-events",
        "streaming",
        "gitops"
      ],
      "templating": {
        "list": []
      },
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timezone": "browser",
      "title": "Customer Events Producer",
      "uid": "customer-events-producer",
      "version": 1
    }
