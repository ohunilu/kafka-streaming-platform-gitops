apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "customer-events-producer.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "customer-events-producer.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "customer-events-producer.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "customer-events-producer.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}

      containers:
        - name: customer-events-producer
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kafka.secretName }}
                  key: bootstrap.servers

            - name: KAFKA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kafka.secretName }}
                  key: api.key

            - name: KAFKA_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kafka.secretName }}
                  key: api.secret

            - name: KAFKA_TOPIC
              value: {{ .Values.kafka.topic | quote }}

            - name: PORT
              value: "8080"

          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}
